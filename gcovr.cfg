# Coverage of the native tests: pio test -e coverage, then gcovr.
# Only the files the native env builds show up (build_src_filter);
# the rest of src/ needs the ESP32 and isn't measured.
filter = src/
object-directory = .pio/build/coverage
sort = uncovered-percent
print-summary = yes
html-title = ESPSomfy-RTS native tests
html-details = coverage/
